<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin"><meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes"><title>Pokémon Picks</title>
<style>
:root{--bg:#f4f5f7;--fg:#1f2933;--card:#fff;--mut:#6b7280;--ac:#0066cc;--hi:#e0245e}
@media(prefers-color-scheme:dark){:root{--bg:#111827;--fg:#e5e7eb;--card:#1f2937;--mut:#9ca3af;--ac:#4da3ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif;
padding:env(safe-area-inset-top) 10px calc(20px + env(safe-area-inset-bottom))}
nav{display:flex;gap:8px;padding:10px 0;position:sticky;top:0;background:var(--bg);z-index:2;align-items:center}
button,select,input{font:inherit;color:inherit}
nav button,.go{border:0;border-radius:8px;min-height:44px;padding:0 16px;background:var(--card);cursor:pointer}
nav button.on{background:var(--ac);color:#fff}.go{background:var(--ac);color:#fff;width:100%;font-weight:600}
.go:disabled{opacity:.5}#st{color:var(--mut);margin:8px 2px;min-height:1.3em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chips span{padding:6px 10px;border-radius:99px;background:var(--card);
font-size:13px;cursor:pointer}.chips span.off{opacity:.35;text-decoration:line-through}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}}
.card{background:var(--card);border-radius:10px;overflow:hidden;border:2px solid transparent}.card.on{border-color:var(--hi)}
.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#8883}
.m{display:flex;justify-content:space-between;align-items:center;padding:2px 8px 0;font-weight:600}
.m button{border:0;background:none;font-size:26px;color:var(--mut);min-width:44px;min-height:44px;cursor:pointer}
.card.on .m button{color:var(--hi)}small{display:block;padding:0 8px 8px;color:var(--mut);font-size:11px;min-height:1.4em}
details{background:var(--card);border-radius:8px;padding:8px 12px;margin:10px 0}summary{cursor:pointer;min-height:32px}
details label{display:block;margin:8px 0}details input,details select{width:100%;padding:8px;border-radius:6px;border:1px solid #8886;background:var(--bg)}
.row{display:flex;gap:8px;margin:8px 0}.row button{flex:1;min-height:40px;border:0;border-radius:8px;background:var(--bg);cursor:pointer}
</style></head><body>
<nav><button id="t1" class="on">Discover</button><button id="t2">Liked (0)</button><button id="t3">Dismissed (0)</button></nav>

<button class="go" id="go">Find pictures</button><p id="st"></p>
<details><summary>Search tags</summary><p>Tap built-in tags to turn them off. Tap your tags to remove them.</p>

<label>Add excluded tag<input id="excludeInput" placeholder="e.g. gore" autocapitalize="off"></label>

<details><summary>Settings</summary>
<label>Source<select id="src"><option value="danbooru">Danbooru</option><option value="safebooru">Safebooru</option></select></label>

<label>Built-in tags searched per run<select id="ns"><option>8</option><option>12</option><option>20</option></select></label>
<label>Candidate pool<select id="pool"><option value="100">100</option><option value="200">200</option><option value="400">400</option></select></label>
<label>Maximum pictures to show<select id="display"><option value="25">25</option><option value="50">50</option><option value="75">75</option></select></label>
<label>Minimum score<select id="minScore"><option value="0">Any</option><option value="5">5+</option><option value="10">10+</option><option value="20">20+</option><option value="50">50+</option></select></label>
<label>Created on or after<input id="since" type="date"></label>
<label>API address override (optional, e.g. your proxy)<input id="api" placeholder="https://..." autocapitalize="off"></label>
<div class="row"><button id="rs">Forget shown pictures</button></div></details>
<div class="grid" id="g1"></div></main>
<main id="v2" hidden><div class="row"><button id="ex">Copy liked as JSON</button></div><div class="grid" id="g2"></div></main>
<main id="v3" hidden><div class="row"><button id="clearDismissed">Clear dismissed list</button></div><div class="grid" id="g3"></div></main>

function renderTags(id,tags,key){const box=$('#'+id);box.innerHTML='';tags.forEach((tag,i)=>{const c=document.createElement('span');
c.textContent=tag+' ×';c.title='Remove '+tag;c.onclick=()=>{tags.splice(i,1);SV(key,tags);renderTags(id,tags,key)};box.appendChild(c)})}
function addTag(input,list,key,id){const e=$('#'+input),tag=e.value.trim().replace(/\s+/g,'_').toLowerCase();
if(!/^[a-z0-9_()!:+.@-]{1,80}$/.test(tag)||tag.startsWith('-')){say('Enter one valid tag (use the excluded-tag list for tags to omit).');return}
if(!list.includes(tag)){list.push(tag);SV(key,list);renderTags(id,list,key)}e.value=''}

$('#addExclude').onclick=()=>addTag('excludeInput',excludedTags,'excludedTags','excludedChips');
